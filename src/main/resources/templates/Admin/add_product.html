<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

  <section>
  
       <div class="container p-5">
        <div class="row">
         <div class="col-md-6 p-5">
  <img th:src="@{/img/main_img/productadd.png}" width="100%" height="550px" style="border-radius:10px;">
</div>
         
        
         <div class="col-md-6  p-5">
          <div class="card card-sh">
           <div class="card-header text-center fs-4">
            <p class="fs-4 fw-bold logo-text">Add Product</p>
        
             <th:block th:if="${session.succMsg}">
             	<p class="text-success fw-bold">[[${session.succMsg}]]</p>
                 <span th:text="${@commonServiceImpl.removeSessionMessage()}"></span>
              </th:block>
              
              <th:block th:if="${session.errorMsg}">
             	<p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
                 <span th:text="${@commonServiceImpl.removeSessionMessage()}"></span>
              </th:block>

   <!--   <div th:if="${session.errorMsg}" class="text-danger fw-bold">
        [[${session.errorMsg}]]
    </div>   -->
           
           </div>
           
             <div class="card-body ">
               <form action="/admin/saveProduct" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                   <label>Enter Title</label>
                   <input type="text" name="title" class="form-control">
                </div>
                
                <div class="mb-3">
                   <label>Enter Description</label>
                  <textarea rows="3" cols="" name="description" class="form-control"></textarea>
                </div>
                
                 <div class="mb-3">
                   <label>Category</label>
                   <select class="form-control" name="category">
                     <option>---Select Category---</option>
                     <option th:each="c:${categories}">[[${c.name}]]</option>
                   </select>
                </div>
                
                 <div class="mb-3">
                   <label>Enter Price</label>
                   <input type="number" name="price" class="form-control">
                </div>
                
                <div class="mb-3">
                    <label>Status</label>
                       <div class="form-check">
                        <input class="form-check-input" type="radio" checked value="true" name="isActive" id="radioDefault1">
                          <label class="form-check-label" for="radioDefault1">
                             Active
                           </label>
                          </div>
                          <div class="form-check">
                             <input class="form-check-input" type="radio" value="false" name="isActive" id="radioDefault2" >
                             <label class="form-check-label" for="radioDefault2">
                                isActive
                           </label>
                      </div>
                  </div>
                
               <div class="row">
                  <div class="mb-3 col">
                      <label>Enter Stock</label>
                      <input type="text" name="stock" class="form-control">
                  </div>
                  <div class="mb-3 col">
                      <label>Upload img</label>
                      <input type="file" name="file" class="form-control">
                  </div>
                  <button class="btn btn-primary col-md-12">Submit</button>
               </div>
                
               </form>
             </div>
          </div>
         </div>
        </div>
       </div>
  
  </section>

</body>
</html>
