<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

  <section>
  
        <div class="container-fluid p-5 mt-5">
         <div class="row">
          <div class="col-md-3 offset-md-5">
           <div class="card">
            <div class="card-header text-center ">
            
            <p class="fs-4">Edit Category</p>

            <th:block th:if="${session.succMsg}">
             	<p class="text-success fw-bold">[[${session.succMsg}]]</p>
                 <span th:text="${@commonServiceImpl.removeSessionMessage()}"></span>
              </th:block>
              
              <th:block th:if="${session.errorMsg}">
             	<p class="text-success fw-bold">[[${session.errorMsg}]]</p>
                 <span th:text="${@commonServiceImpl.removeSessionMessage()}"></span>
              </th:block> 
           
            </div>
            
         
            
             <div class="card-body">
                <form action="/admin/updateCategory" method="Post" enctype="multipart/form-data" name="name" >
               
                <input type="hidden" name="id" th:value="${category.id}">
            
                 <div class="mb-3">
                    <label>Enter Category</label>
                    <input type="text" name="name" class="form-control"  th:value="${category.name}">
                 </div>
                 
                  <div class="mb-3">
                    <label>Status</label>
                    
                       <div class="form-check">
                        <input class="form-check-input" type="radio" value="true" name="isActive" id="radioDefault1" th:checked="${category.isActive==true}" >
                          <label class="form-check-label" for="radioDefault1">
                             Active
                           </label>
                          </div>
                          <div class="form-check">
                             <input class="form-check-input" type="radio" value="false" name="isActive" id="radioDefault2" th:checked="${category.isActive==false}" >
                             <label class="form-check-label" for="radioDefault2">
                                InActive
                           </label>
                   </div>
                   
                 </div>
                 <div class="mb-3">
                   <label>Upload File</label>
                   <input type="file" name="file" class="form-control">
                 </div>
                 
                 <img alt="" th:src="@{'/img/category_img/'+${category.imgName}}" width="50px" height="50px">
                 
                 <button class="btn btn-primary col-md-12 mt-2">Update</button>
             
                </form>
             </div>
           </div>
          </div>
          
         
             
          
         </div>
        </div>
  
  </section>

</body>
</html>
