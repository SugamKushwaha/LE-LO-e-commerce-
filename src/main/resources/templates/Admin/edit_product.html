<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

  <section>
  
       <div class="container p-5 mt-4">
        <div class="row">
         <div class="col-md-8 offset-md-2">
          <div class="card card-sh">
           <div class="card-header text-center fs-4">
            <p class="fs-4">Edit Product</p>
        
             <th:block th:if="${session.succMsg}">
             	<p class="text-success fw-bold">[[${session.succMsg}]]</p>
                 <span th:text="${@commonServiceImpl.removeSessionMessage()}"></span>
              </th:block>
              
              <th:block th:if="${session.errorMsg}">
             	<p class="text-success fw-bold">[[${session.errorMsg}]]</p>
                 <span th:text="${@commonServiceImpl.removeSessionMessage()}"></span>
              </th:block>

   <!--   <div th:if="${session.errorMsg}" class="text-danger fw-bold">
        [[${session.errorMsg}]]
    </div>   -->
           
           </div>
           
             <div class="card-body ">
               <form action="/admin/updateProduct" method="post" enctype="multipart/form-data">
               <input type="hidden" name="id" th:value="${product.id}">
                <div class="mb-3">
                   <label>Enter Title</label>
                   <input type="text" name="title" class="form-control" th:value="${product.title}">
                </div>
                
                <div class="mb-3">
                   <label>Enter Description</label>
                  <textarea rows="3" cols="" name="description" class="form-control">[[${product.description}]]</textarea>
                </div>
                
                <div class="row">
                 <div class="mb-3 col">
                   <label>Enter Category</label>
                   <select class="form-control" name="category">
                     <option>[[${product.category}]]</option>
                     <option th:each="c:${categories}">[[${c.name}]]</option>
                   </select>
                </div>
                
                <div class="mb-3 col">
                   <label>Enter Price</label>
                   <input type="number" name="price" class="form-control" th:value="${product.price}">
                </div>
                
              </div>
              
              <div class="row">
                    <div class="mb-3 col">
                   <label>Discount</label>
                   <input type="number" name="discount" class="form-control" th:value="${product.discount}">
                </div>
                
                   <div class="mb-3 col">
                   <label>Discount Price</label>
                   <input type="number" name="price" class="form-control" th:value="${product.discountPrice}" readonly>
                </div>
              </div>
              
              <div class="mb-3">
                    <label>Status</label>
                       <div class="form-check">
                        <input class="form-check-input" type="radio" checked value="true" th:checked="${product.isActive==true}"  name="isActive" id="radioDefault1">
                          <label class="form-check-label" for="radioDefault1">
                             Active
                           </label>
                          </div>
                          <div class="form-check">
                             <input class="form-check-input" type="radio" value="false" name="isActive" th:checked="${product.isActive==false}" id="radioDefault2" >
                             <label class="form-check-label" for="radioDefault2">
                                InActive
                           </label>
                      </div>
                  </div>
                
               <div class="row">
                  <div class="mb-3 col">
                      <label>Enter Stock</label>
                      <input type="text" name="stock" class="form-control" th:value="${product.stock}">
                  </div>
                  
                 
                  <div class="mb-3 col">
                      <label>Upload Image</label>
                      <input type="file" name="file" class="form-control">
                  </div>
                  
                  <div class="mt-1 mb-1"> <img th:src="@{'/img/product_img/'+${product.image}}" width="70px" height="70px"></div>
                  
                  <button class="btn btn-primary col-md-12">Update</button>
               </div>
                
               </form>
             </div>
          </div>
         </div>
        </div>
       </div>
  
  </section>

</body>
</html>
