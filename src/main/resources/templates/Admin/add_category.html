<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

  <section>
  
        <div class="container-fluid p-5 mt-5">
         <div class="row">
          <div class="col-md-3">
           <div class="card">
            <div class="card-header text-center ">
            
            <p class="fs-4 fw-bold">Add Category</p>
   
            
      <!--  <div th:if="${session.succMsg}" class="text-success fw-bold">
        [[${session.succMsg}]]
    </div>

    <div th:if="${session.errorMsg}" class="text-danger fw-bold">
        [[${session.errorMsg}]]
    </div>   --> 
    
                <th:block th:if="${session.succMsg}">
             	<p class="text-success fw-bold">[[${session.succMsg}]]</p>
                 <span th:text="${@commonServiceImpl.removeSessionMessage()}"></span>
              </th:block>
              
              <th:block th:if="${session.errorMsg}">
             	<p class="text-success fw-bold">[[${session.errorMsg}]]</p>
                 <span th:text="${@commonServiceImpl.removeSessionMessage()}"></span>
              </th:block>
            
            </div>
            
         
            
             <div class="card-body">
                <form action="/admin/saveCategory" method="post" enctype="multipart/form-data" name="name">
            
                 <div class="mb-3">
                    <label>Enter Category</label>
                    <input type="text" name="name" class="form-control">
                 </div>
                 
                  <div class="mb-3">
                    <label>Status</label>
                       <div class="form-check">
                        <input class="form-check-input" type="radio" checked value="true" name="isActive" id="radioDefault1">
                          <label class="form-check-label" for="radioDefault1">
                             Active
                           </label>
                          </div>
                          <div class="form-check">
                             <input class="form-check-input" type="radio" value="false" name="isActive" id="radioDefault2" >
                             <label class="form-check-label" for="radioDefault2">
                                InActive
                           </label>
                      </div>
                   
                  </div>
                 
                 <div class="mb-3">
                   <label>Upload File</label>
                   <input type="file" name="file" class="form-control">
                 </div>
                 
                 <button class="btn btn-primary col-md-12 mt-2">Save</button>
             
                </form>
             </div>
           </div>
          </div>
          
          <div class="col-md-8">
           <div class="card card-sh">
           <div class="card-header text-center fs-4 fw-bold">Category Datails</div>
            <div class="card-body">
                <table class="table">
                 <thead>
                   <tr>
                     <th scope="col">S No.</th>
                     <th scope="col">Category</th>
                     <th scope="col">Status</th>
                     <th scope="col">Image</th>
                     <th scope="col">Action</th>
                   </tr>
                </thead>
                <tbody>
                  <tr th:each="cat, c:${categories}">
                    <th scope="row">[[${c.count}]]</th>
                    <td>[[${cat.name}]]</td>
                    <td>[[${cat.isActive}]]</td>
                    <td><img th:src="@{'/img/category_img/'+${cat.imgName}}" width="50px" height="50px"></td>
                    <td>
                    <a th:href="@{'/admin/loadEditCategory/'+${cat.id}}"  class="btn btn-success"><i class="fa-solid fa-pen-to-square"></i>Edit</a>
                    <a th:href="@{'/admin/deleteCategory/'+${cat.id}}" class="btn btn-danger "><i class="fa-solid fa-trash"></i>Delete</a>
                    </td>
                  </tr>
                 
                </tbody>
              </table>
            </div>
           </div>
          </div>
          
         </div>
        </div>
  
  </section>

</body>
</html>
