<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

    <section>
      
      <div class="container mt-0 p-5">
        <div class="row">
         <div class="col-md-6 p-5">
  <img th:src="@{/img/main_img/productadd.png}" width="100%" height="550px" style="border-radius:10px;">
</div>

         <div class="col-md-6 p-5 ">
          <div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
            <div class="card-header">
            <p class="fs-4 text-center fw-bold logo-text">Register</p>
            
            
             <th:block th:if="${session.succMsg}">
             	<p class="text-success fw-bold text-center">[[${session.succMsg}]]</p>
                 <span th:text="${@commonServiceImpl.removeSessionMessage()}"></span>
              </th:block>
              
              <th:block th:if="${session.errorMsg}">
             	<p class="text-success fw-bold text-center">[[${session.errorMsg}]]</p>
                 <span th:text="${@commonServiceImpl.removeSessionMessage()}"></span>
              </th:block>
            
              <div class="card-body">
                <form action="/admin/save-admin" enctype="multipart/form-data" method="post">
                <div class="row">
                  <div class="col">
                  
                  
                   <label class="form-label">Full name</label>
                   <input class="form-control" name="name" type="text" required>
                   </div>
                  
                  <div class="col">
                   <label class="form-label">Mobile Number</label>
                   <input class="form-control" name="mobileNumber" type="number" required>
                  </div>
                  
                 </div>  
                 
                 <div class="mb-3">
                   <label class="form-label">Email</label>
                   <input class="form-control" name="email" type="email" required>
                 </div>
                 
                  <div class="row">
                  <div class="col">
                  
                  
                   <label class="form-label">Address</label>
                   <input class="form-control" name="address" type="text" required>
                   </div>
                  
                  <div class="col">
                   <label class="form-label">City</label>
                   <input class="form-control" name="city" type="text" required>
                  </div>
                  
                 </div> 
                 
                  <div class="row">
                  <div class="col">
                  
                  
                   <label class="form-label">State</label>
                   <input class="form-control" name="state" type="text" required>
                   </div>
                  
                  <div class="col">
                   <label class="form-label">Pin Code</label>
                   <input class="form-control" name="pincode" type="number" required>
                  </div>
                  
                 </div> 
                 
                  <div class="row">
                  <div class="col">
                  
                  
                   <label class="form-label">Password</label>
                   <input class="form-control" name="password" type="password" required>
                   </div>
                  
                  <div class="col">
                   <label class="form-label">Confirm Password</label>
                   <input class="form-control" name="cpassword" type="password" required>
                  </div>
                  
                 </div> 
                 
                   <div class="col">
                      <label class="form-label">Profile Image</label>
                   <input class="form-control" name="img" type="file">
                   </div>
                  
                  <br>
                                    
                  <button type="submit" class="btn btn-primary text-white text-center com-md-12">Register</button>
                  
                </form>
              </div>
             
            </div>
          </div>
          </div>
         </div>
       </div>
      
    </section>

</body>
</html>
