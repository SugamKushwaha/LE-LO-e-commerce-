<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
rel="stylesheet" 
integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
crossorigin="anonymous">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />


<link rel="stylesheet" th:href="@{/css/product.css}">

</head>
<body>

<section>

<div class="container-fluid bg-secondary product-col p-5 mt-3">
   <div class="row">
     <div class="col-md-8 offset-md-2">
       <form action="search-product" method="get">
         <div class="input-group mt-2">
           <input type="text" class="form-control" name="ch">
           <button class="btn search-col text-white ms-3 col-md-2"><i class="fa-solid fa-magnifying-glass"></i>Search</button>
         </div>
       </form>
     </div>
   </div>
</div>

  <div class="container-fluid mt-1">
    <div class="row">
      <div class="col-md-2 p-0">
        <div class="card">
          <div class="card-body">
            <div class="list-group ">
            <p class="fs-5 fw-bold"style="margin-left: 40px">Category</p>
              <a href="/products" class="list-group-item  list-group-item-action" th:classappend="${paramValue==''} ? 'active':''" aria-current="true">
               All
              </a>
              <a th:href="@{'/products?category='+${c.name}}" th:classappend="${paramValue == c.name} ? 'active':''" th:each="c:${categories}" class="list-group-item list-group-item-action ">[[${c.name}]]</a>
             
            </div>
          </div>
       </div>
     </div>
   
      <div class="col-md-10">
         <div class="card">
           <div class="card-body">
             <p class="fs-3 text-center fw-bold">Products</p>
             
             
             <div class="row">
             
             <th:block th:if="${products.size>0}">
             
               <div class="col-md-3" th:each="p:${products}">
                 <div class="card shadow-sm p-3 mb-4  bg-body-tertiary rounded">
                   <div class="card-body text-center">
                   
                   
                     <img class="productImg-height" alt="" th:src="@{'/img/product_img/'+${p.image}}" width="65%" height="155px">
                     
                     
                    <div class="productTxt-height m-2 " style="font-size: 14px;height: 37px;"> <p class="fs-10 text-center">[[${p.title}]]</p></div>
                     
                      <div class="row text-center">
                        <p class="fs-8 fw-bold ">
                         <span>[[${p.discountPrice}]]</span><br>
                         <span class="text-decoration-line-through fs-6 text-secondary">&#8377;[[${p.price}]]</span>
                         <span class="fs-6 text-success">[[${p.discount}]]% off</span>
                         </p>
                        <a th:href="@{'/product/'+${p.id}}" class="btn btn-primary col-md-6 offset-md-3">View Details</a>
                      </div>
                   </div> 
                 </div>
               </div> 
               
               </th:block>
               
               <th:block th:unless="${products.size>0}">
                 <p class="fs-4 text-center text-danger mt-4">product is not availble</p>
               </th:block>
               
                <!-- TODO remove after backend -->
               </div>
             
           </div>
         </div>
         <!-- Start pagination -->

      </div>
    </div>
  </div>

</section>

</body>
</html>
