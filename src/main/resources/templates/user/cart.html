<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>cart</title>
</head>
<body>

  <section>
     
       <div class="container-fluid mt-5  p-5 bg-product">
       
         <div class="card  card-sh"><!-- card  -->
           <div class="card-header text-center">
             <p class="fs-3 fw-bold">Cart Products</p>
              <th:block th:if="${session.succMsg}">
             	<p class="text-success fw-bold">[[${session.succMsg}]]</p>
                 <span th:text="${@commonServiceImpl.removeSessionMessage()}"></span>
              </th:block>
              
              <th:block th:if="${session.errorMsg}">
             	<p class="text-success fw-bold">[[${session.errorMsg}]]</p>
                 <span th:text="${@commonServiceImpl.removeSessionMessage()}"></span>
              </th:block>
            </div>
            <div ><!-- class="card-body" -->
               <table class="table">
           <thead>
             <tr>
               <th scope="col">S no.</th>
               <th scope="col">Product</th>
               <th scope="col">Product Details</th>
               <th scope="col">Price</th>
               <th scope="col" class="text-center">Quantity</th>
               <th scope="col">Total Price</th>
               
             </tr>
           </thead>
             <tbody >
               <tr th:each="cart,c:${carts}"  >
                 <td scope="row">[[${c.count}]]</td>
                 <td><img th:src="@{'/img/product_img/'+${cart.product.image}}" width="60px" height="60px" style="border: 1px ; border-radius: 10px;"></td>
                 <td class="fs-9">[[${cart.product.title}]]</td>
                 <td>[[${cart.product.discountPrice}]]</td>
                 <td class="text-center"><a th:href="@{'/user/cartQuantityUpdate?sy=de&cid='+${cart.id}}"><i class="fa-solid fa-minus"></i></a>
                 [ [[${cart.quantity}]] ]
                 <a th:href="@{'/user/cartQuantityUpdate?sy=in&cid='+${cart.id}}"><i class="fa-solid fa-plus"></i></a></td>
                 
                 <td>[[${cart.totalPrice}]]</td>
              
               </tr>
               <tr>
               <td colspan="4"></td>
               <td class="fw-bold"></td>
               <td class="fw-bold">&#8377;[[${totalOrderPrice}]]</td>
               </tr>
           
           
             </tbody>
           </table>
           
           <div class="text-center p-5"><a href="/user/orders" class="btn btn-warning">proceed Payment</a></div>
           
          </div>
         </div>
         </div>
       
  </section>

</body>
</html>
