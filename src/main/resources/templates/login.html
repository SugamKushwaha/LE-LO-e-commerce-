<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Login here</title>
</head>
<body>

    <section>
       
       <div class="container mt-5 bg-product">
        <div class="row">
         <div class="col-md-6 p-5">
           <img alt="" src="img/main_img/login.png" width="100%" height="450px">
         </div>
         
         <div class="col-md-6 mt-3 p-5">
          <div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
            <div class="card-header">
            <p class="fs-3 text-center fw-bold  logo-text">Login</p>
            
            <div th:if="${param.error}" class="alert alert-danger text-center">[[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]</div>
            <div th:if="${param.logout}" class="alert alert-success">Logout SuccessFully</div>
            
              <div class="card-body">
                <form action="/login" method="post">
                  <div class="mb-3">
                   <label class="form-label">Email</label>
                   <input class="form-control" name="username" type="email">
                  </div>
                  <div class="mb-3">
                   <label class="form-label">Password</label>
                   <input class="form-control" name="password" type="password">
                  </div>
                  <button type="submit" class="btn btn-primary text-white text-center com-md-12" style="border: 1px solid black;">Login</button>
                  
                </form>
              </div>
              
              <div class="card-footer text-center">
                <a href="/forget-password" >Forget Password</a><br>
                Don't have an account ? <a href="/Register" class="text-decoration-none">create one</a>
              </div>
              
            </div>
          </div>
          </div>
         </div>
       </div>
       
       
    </section>

</body>
</html>
