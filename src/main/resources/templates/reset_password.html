<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

    <section>
       
       <div class="container bg-product mt-5 p-5">
        <div class="row">
         <div class="col-md-6 p-5">
           <img alt="" src="img/main_img/login.png" width="100%" height="400px">
         </div>
         
         <div class="col-md-6 mt-3 p-5">
          <div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
            <div class="card-header">
            <p class="fs-4 text-center">reset Password</p>
            
             <th:block th:if="${session.succMsg}">
             	<p class="text-success fw-bold text-center">[[${session.succMsg}]]</p>
                 <span th:text="${@commonServiceImpl.removeSessionMessage()}"></span>
              </th:block>
              
              <th:block th:if="${session.errorMsg}">
             	<p class="text-danger fw-bold text-center">[[${session.errorMsg}]]</p>
                 <span th:text="${@commonServiceImpl.removeSessionMessage()}"></span>
              </th:block>
           
            
              <div class="card-body">
                <form action="/reset-password" method="post">
                
                  <div class="mb-3">
                   <label class="form-label">New Password</label>
                   <input class="form-control" name="password" type="password" >
                  </div>
                  
                  <div class="mb-3">
                   <label class="form-label">Confirm Password</label>
                   <input class="form-control" name="confirmPassword" type="password" >
                  </div>
                  <input type="hidden" th:value="${token}" name="token">
                  <div class="text-center">
                  <button type="submit" class="btn btn-primary text-white text-center"style="border: 1px solid black;">Reset password</button>
                  </div>
                  
                </form>
              </div>
              
              
            </div>
          </div>
          </div>
         </div>
       </div>
       
       
    </section>

</body>
</html>
